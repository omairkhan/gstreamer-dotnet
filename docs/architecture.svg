<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<style>
  :root { --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --text:#1f2328; --muted:#59636e;
          --gst:#e8f1fb; --gstb:#4a86c5; --net:#efe9fb; --netb:#512bd4; --out:#e6f6ec; --outb:#2da44e; --q:#fff8e5; --qb:#bf8700; --arrow:#6e7781; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#9198a1;
            --gst:#10243a; --gstb:#58a6ff; --net:#221a3d; --netb:#a48cf5; --out:#0f2a1a; --outb:#3fb950; --q:#2b2310; --qb:#d29922; --arrow:#8b949e; }
  }
  .bg { fill:var(--bg); }
  .panel { fill:var(--panel); stroke:var(--line); stroke-width:1; }
  .gst { fill:var(--gst); stroke:var(--gstb); stroke-width:1.4; }
  .net { fill:var(--net); stroke:var(--netb); stroke-width:1.6; }
  .out { fill:var(--out); stroke:var(--outb); stroke-width:1.6; }
  .q   { fill:var(--q); stroke:var(--qb); stroke-width:1.4; stroke-dasharray:4 3; }
  .t { fill:var(--text); font-size:13px; font-weight:600; text-anchor:middle; }
  .s { fill:var(--muted); font-size:11px; text-anchor:middle; }
  .h { fill:var(--text); font-size:22px; font-weight:700; }
  .sub { fill:var(--muted); font-size:13px; }
  .lbl { fill:var(--muted); font-size:12px; font-weight:700; letter-spacing:.08em; }
  .lane { fill:var(--muted); font-size:12px; font-weight:600; }
  .edge { fill:var(--muted); font-size:11px; font-style:italic; }
  .ln { fill:none; stroke:var(--arrow); stroke-width:1.6; }
  .dash { fill:none; stroke:var(--netb); stroke-width:1.6; stroke-dasharray:6 4; }
  #ah path { fill:var(--arrow); }
  #ahn path { fill:var(--netb); }
</style>
